{% extends 'base.html' %}{% block title %}{{ mode }} product · Beauté{% endblock %}{% block content %}<div class="formpage"><span class="eyebrow">CATALOG MANAGEMENT</span><h1>{{ mode }} product</h1><form method="post" class="productform"><label>Product ID<input name="product_id" value="{{ p['product_id'] if p else '' }}" {% if p %}readonly{% endif %}></label><label>Product name<input name="product_name" required value="{{ p['product_name'] if p else '' }}"></label><label>Brand<input name="brand_name" value="{{ p['brand_name'] if p else '' }}"></label><label>Price USD<input type="number" step="0.01" name="price_usd" value="{{ p['price_usd'] if p else '' }}"></label><label>Rating<input type="number" step="0.1" min="0" max="5" name="rating" value="{{ p['rating'] if p else '' }}"></label><label>Reviews<input type="number" name="reviews" value="{{ p['reviews'] if p else 0 }}"></label><label>Size<input name="size" value="{{ p['size'] if p else '' }}"></label><label>Primary category<input name="primary_category" value="{{ p['primary_category'] if p else '' }}"></label><label>Secondary category<input name="secondary_category" value="{{ p['secondary_category'] if p else '' }}"></label><label>Tertiary category<input name="tertiary_category" value="{{ p['tertiary_category'] if p else '' }}"></label><label>Highlights<textarea name="highlights">{{ p['highlights'] if p else '' }}</textarea></label><label>Ingredients<textarea name="ingredients">{{ p['ingredients'] if p else '' }}</textarea></label><label>New <input type="checkbox" name="new_product" {% if p and p['new_product'] %}checked{% endif %}></label><label>Online only <input type="checkbox" name="online_only" {% if p and p['online_only'] %}checked{% endif %}></label><label>Out of stock <input type="checkbox" name="out_of_stock" {% if p and p['out_of_stock'] %}checked{% endif %}></label><label>Sephora exclusive <input type="checkbox" name="sephora_exclusive" {% if p and p['sephora_exclusive'] %}checked{% endif %}></label><label>Limited edition <input type="checkbox" name="limited_edition" {% if p and p['limited_edition'] %}checked{% endif %}></label><button class="primary big">{{ mode }} product</button></form></div>{% endblock %}
